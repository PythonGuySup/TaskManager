replicaCount: 1

image:
  repository: localhost:5000/event-service
  tag: "java-1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002

containerPort: 8002

env:
  # --- Spring Boot ---
  SERVER_PORT: "8002"
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  # --- Kafka ---
  KAFKA_HOST: "kafka-cluster-kafka-bootstrap"
  KAFKA_TOPIC: "tasks"

  # --- MongoDB ---
  MONGODB_URI: "mongodb://eventuser:eventpass@mongodb:27017/eventdb?authSource=admin"

resources:
  requests:
    cpu: "100m"
    memory: "384Mi"
  limits:
    cpu: "1000m"
    memory: "768Mi"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8002
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8002
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8002
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 20

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 15s
  port: 8002

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8002"