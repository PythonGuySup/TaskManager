replicaCount: 1

image:
  repository: localhost:5000/notification-service
  tag: "java-1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8003
  targetPort: 8003

containerPort: 8003

env:
  # --- Spring Boot ---
  SERVER_PORT: "8003"
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  # --- Kafka (consumer) ---
  KAFKA_HOST: "kafka-cluster-kafka-bootstrap"
  KAFKA_TOPIC: "tasks"
  KAFKA_GROUP_ID: "notification-group"

resources:
  requests:
    cpu: "100m"
    memory: "384Mi"
  limits:
    cpu: "1000m"
    memory: "768Mi"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8003
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8003
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8003
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 20

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 15s
  port: 8003

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8003"